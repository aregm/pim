name: ci
on: [push, pull_request]
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26 }
      - run: npm ci
      - run: npm run lint
      - run: npm run contracts && git diff --exit-code contracts
      - run: npm test
      - run: npm run setup
      - name: gate 0
        run: |
          (npm run engine > engine.out 2>&1 &) ; sleep 15
          npm run gate0
          pkill -f 'iii compose' || true
