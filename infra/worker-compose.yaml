# One engine per machine for PIM, bound to loopback. Start with `npm run engine` (sets III_TELEMETRY_ENABLED=false).
namespace: pim
engine:
  url: ws://127.0.0.1:49140
  workers:
    configuration:
      adapter:
        name: fs
        config:
          directory: ./.iii/config
    iii-worker-manager:
      host: 127.0.0.1
      port: 49140
containers:
  parse:
    worker: path://../packages/worker-parse
    restart: on-failure
    scripts:
      run: node src/index.ts
  media:
    worker: path://../workers-py/media
    restart: on-failure
    scripts:
      run: ../../.tooling/py/bin/python src/main.py
  web-preserve:
    worker: path://../packages/worker-web-preserve
    restart: on-failure
    environment:
      ELECTRON_RUN_AS_NODE: ""
    scripts:
      run: ../../node_modules/.bin/electron src/index.mjs
  model:
    worker: path://../packages/worker-model
    restart: on-failure
    environment:
      OLLAMA_URL: http://127.0.0.1:11434
    scripts:
      run: node src/index.ts
  ade: # iii's console: traces, logs, workers and their settings, at http://127.0.0.1:3114 (3113 is the registry default)
    worker: package://ade
    version: "1.9.74"
    restart: on-failure
    config_override:
      http_port: 3114
  http:
    worker: package://api.workers.iii.dev/http
    version: "0.22.8"
    restart: on-failure
    config_override:
      host: 127.0.0.1
      port: 3111
